name: Verify development branch

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ensure release version is new
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $match = Select-String -Path CMakeLists.txt -Pattern 'project\(CommunicationAnalyzer VERSION ([0-9]+\.[0-9]+\.[0-9]+)' | Select-Object -First 1
          if (-not $match) {
            throw 'Unable to read the project version from CMakeLists.txt.'
          }
          $version = $match.Matches.Groups[1].Value
          git ls-remote --exit-code --tags origin "refs/tags/v$version" | Out-Null
          if ($LASTEXITCODE -eq 0) {
            throw "Release v$version already exists. Bump the version in CMakeLists.txt before merging to main."
          }
          $global:LASTEXITCODE = 0

      - name: Initialize MSVC build environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.6.3
          arch: win64_msvc2019_64
          modules: qtserialport

      - name: Install WiX Toolset v3
        shell: pwsh
        run: choco install wixtoolset --no-progress --limit-output --yes

      - name: Configure, build and package
        shell: pwsh
        run: |
          cmake -S . -B build/verify -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DQt6_DIR=$env:QT_ROOT_DIR/lib/cmake/Qt6" `
            -DCOMMUNICATION_ANALYZER_RUN_AFTER_BUILD=OFF
          cmake --build build/verify --config Release --parallel
          cpack --config build/verify/CPackConfig.cmake -G WIX -B artifact
